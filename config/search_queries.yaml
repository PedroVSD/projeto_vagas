  # 6. Canadá - vagas remotas (§6)
  - query: '("Data Scientist" OR "Data Science" OR "Data Analyst" OR "Cientista de Dados") AND (Junior OR "Entry Level" OR "Early Career" OR Intern OR Internship OR Co-op OR Coop) AND (Remote OR "Fully Remote" OR "100% Remote" OR "Work From Home") NOT (Senior OR "Senior-Level" OR Lead OR Principal OR Staff OR Manager OR Director)'

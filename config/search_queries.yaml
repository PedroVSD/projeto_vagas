# Fase 3 - Famílias de buscas configuráveis (editável sem mudar código)
# Spec §5 + markdown/buscas_booleanas_vagas.md
# Simple = queries literais; Boolean = sintaxe AND/OR/NOT p/ motores que suportam
# search_profiles = estrutura canônica §11 (careers/seniority/locations) p/ geração dinâmica
# Uso: query_service.get_all_queries() retorna simple+boolean; profiles ficam em data["search_profiles"]

simple:
  - query: "MLOps Engineer"
    family: "mlops"
  - query: "Junior MLOps"
    family: "mlops"
  - query: "Machine Learning Engineer"
    family: "ml_engineering"
  - query: "Junior Machine Learning Engineer"
    family: "ml_engineering"
  - query: "ML Engineer"
    family: "ml_engineering"
  - query: "Data Engineer"
    family: "data_engineering"
  - query: "Junior Data Engineer"
    family: "data_engineering"
  - query: "Software Engineer Python"
    family: "software_engineering"
  - query: "Backend Engineer Python"
    family: "software_engineering"
  - query: "Junior Software Engineer"
    family: "software_engineering"
  - query: "Python Developer"
    family: "software_engineering"
  - query: "Data Scientist"
    family: "data_science"
  - query: "Junior Data Scientist"
    family: "data_science"
  - query: "AI Engineer"
    family: "ai_engineering"
  - query: "ML Engineer Intern"
    family: "intern"
  - query: "Data Engineer Intern"
    family: "intern"
  - query: "Software Engineer Intern"
    family: "intern"

# booleanas genéricas (Fase 3 original, compatível Greenhouse/Lever)
boolean:
  - query: '("MLOps" OR "Machine Learning Operations") AND (Junior OR "Entry Level" OR Intern OR Internship)'
    family: "mlops_boolean"
  - query: '("Machine Learning Engineer" OR "ML Engineer") AND (Junior OR Intern OR "Entry Level")'
    family: "ml_engineering_boolean"
  - query: '("Data Engineer" OR "Data Engineering") AND (Junior OR Intern OR "Entry Level")'
    family: "data_engineering_boolean"
  - query: '("Software Engineer" OR "Backend Engineer" OR "Python Developer") AND (Python OR FastAPI OR Go OR Golang) AND (Junior OR Intern OR "Entry Level")'
    family: "software_boolean"

  # === markdown/buscas_booleanas_vagas.md §1-5 - buscas completas com Remote + NOT Senior ===
  # 1. Ciência de Dados
  - query: '("Data Scientist" OR "Data Science" OR "Cientista de Dados" OR "Ciência de Dados") AND (Junior OR "Júnior" OR Jr OR Intern OR Internship OR Estágio OR Estagiário OR Trainee) AND (Remote OR Remoto OR "Fully Remote" OR "100% Remote" OR "Work From Home" OR "Home Office") NOT (Senior OR "Sênior" OR Lead OR Principal OR Staff OR Manager OR Director)'
    family: "data_science_br_boolean_base"
  - query: '("Data Scientist" OR "Data Science" OR "Cientista de Dados" OR "Ciência de Dados") AND (Intern OR Internship OR Internships OR Estágio OR Estagiário OR Estagiária OR Becario OR Becaria OR Prácticas) AND (Remote OR Remoto OR "Fully Remote" OR "100% Remote" OR "Work From Home" OR "Home Office") NOT (Senior OR "Sênior" OR Lead OR Principal OR Staff OR Manager OR Director)'
    family: "data_science_br_boolean_intern"
  - query: '("Data Scientist" OR "Data Science" OR "Cientista de Dados" OR "Ciência de Dados") AND (Junior OR "Júnior" OR Jr OR "Entry Level" OR "Early Career") AND (Remote OR Remoto OR "Fully Remote" OR "100% Remote" OR "Work From Home" OR "Home Office") NOT (Senior OR "Sênior" OR Lead OR Principal OR Staff OR Manager OR Director)'
    family: "data_science_br_boolean_junior"

  # 2. Engenharia de Dados
  - query: '("Data Engineer" OR "Data Engineering" OR "Engenheiro de Dados" OR "Engenharia de Dados") AND (Junior OR "Júnior" OR Jr OR Intern OR Internship OR Estágio OR Estagiário OR Trainee) AND (Remote OR Remoto OR "Fully Remote" OR "100% Remote" OR "Work From Home" OR "Home Office") NOT (Senior OR "Sênior" OR Lead OR Principal OR Staff OR Manager OR Director)'
    family: "data_engineering_br_boolean_base"
  - query: '("Data Engineer" OR "Data Engineering" OR "Engenheiro de Dados" OR "Engenharia de Dados") AND (Intern OR Internship OR Internships OR Estágio OR Estagiário OR Estagiária OR Becario OR Becaria OR Prácticas OR Co-op OR Coop) AND (Remote OR Remoto OR "Fully Remote" OR "100% Remote" OR "Work From Home" OR "Home Office") NOT (Senior OR "Sênior" OR Lead OR Principal OR Staff OR Manager OR Director)'
    family: "data_engineering_br_boolean_intern"
  - query: '("Data Engineer" OR "Data Engineering" OR "Engenheiro de Dados" OR "Engenharia de Dados") AND (Junior OR "Júnior" OR Jr OR "Entry Level" OR "Early Career") AND (Remote OR Remoto OR "Fully Remote" OR "100% Remote" OR "Work From Home" OR "Home Office") NOT (Senior OR "Sênior" OR Lead OR Principal OR Staff OR Manager OR Director)'
    family: "data_engineering_br_boolean_junior"

  # 3. Engenharia de Software
  - query: '("Software Engineer" OR "Software Developer" OR "Software Development" OR "Backend Engineer" OR "Backend Developer" OR "Engenheiro de Software" OR "Desenvolvedor de Software" OR "Engenheiro Backend" OR "Desenvolvedor Backend") AND (Junior OR "Júnior" OR Jr OR Intern OR Internship OR Estágio OR Estagiário OR Trainee) AND (Remote OR Remoto OR "Fully Remote" OR "100% Remote" OR "Work From Home" OR "Home Office") NOT (Senior OR "Sênior" OR Lead OR Principal OR Staff OR Manager OR Director)'

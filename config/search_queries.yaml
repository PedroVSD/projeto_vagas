# Buscas configuráveis (editável sem mudar código)
# Perfil atual: Júnior ou Pleno | remoto ou híbrido
# Idiomas: Português, Inglês e Espanhol
# Países: Chile, Argentina, Espanha, Portugal, Polônia, Estados Unidos e Canadá
#
# O direcionamento por país é feito pelos adapters de cada fonte
# (Jobicy por geo, Get on Board LatAm, Landing.jobs Portugal, LinkedIn multi-país etc.).
# Este arquivo concentra cargos, senioridade, idiomas e modalidades.

simple:
  # MLOps
  - query: "Junior MLOps Engineer"
    family: "mlops"
  - query: "Pleno MLOps Engineer"
    family: "mlops"

  # Machine Learning / IA
  - query: "Junior Machine Learning Engineer"
    family: "ml_engineering"
  - query: "Pleno Machine Learning Engineer"
    family: "ml_engineering"
  - query: "Junior ML Engineer"
    family: "ml_engineering"
  - query: "Pleno ML Engineer"
    family: "ml_engineering"
  - query: "Junior AI Engineer"
    family: "ml_engineering"
  - query: "Pleno AI Engineer"
    family: "ml_engineering"

  # Engenharia de Dados
  - query: "Junior Data Engineer"
    family: "data_engineering"
  - query: "Pleno Data Engineer"
    family: "data_engineering"

  # Engenharia de Software
  - query: "Junior Software Engineer"
    family: "software_engineering"
  - query: "Pleno Software Engineer"
    family: "software_engineering"
  - query: "Junior Python Developer"
    family: "software_engineering"
  - query: "Pleno Python Developer"
    family: "software_engineering"
  - query: "Junior Backend Engineer"
    family: "software_engineering"
  - query: "Pleno Backend Engineer"
    family: "software_engineering"

  # Ciência de Dados
  - query: "Junior Data Scientist"
    family: "data_science"
  - query: "Pleno Data Scientist"
    family: "data_science"

  # Golang
  - query: "Junior Golang Developer"
    family: "golang"
  - query: "Pleno Golang Developer"
    family: "golang"
  - query: "Junior Go Engineer"
    family: "golang"
  - query: "Pleno Go Engineer"
    family: "golang"
  - query: "Junior Backend Golang"
    family: "golang"
  - query: "Pleno Backend Golang"
    family: "golang"

# Booleanas por área e idioma.
# Senioridade: Júnior/Jr/Pleno (PT), Junior/Mid-Level/Intermediate (EN), Junior/Pleno/Semi Senior/SSR (ES).
# Modalidade: remoto ou híbrido apenas.
boolean:
  # === Ciência de Dados ===
  - query: '("Data Scientist" OR "Cientista de Dados" OR "Ciência de Dados") AND (Junior OR "Júnior" OR Jr OR Pleno) AND (Remoto OR "Home Office" OR Híbrido OR Remote OR Hybrid)'
    family: "data_science_pt_boolean"
  - query: '("Data Scientist" OR "Data Science") AND (Junior OR Jr OR "Mid Level" OR "Mid-Level" OR Intermediate) AND (Remote OR Hybrid OR "Work From Home")'
    family: "data_science_en_boolean"
  - query: '("Data Scientist" OR "Cientista de Datos" OR "Ciencia de Datos") AND (Junior OR "Júnior" OR Jr OR Pleno OR "Semi Senior" OR "Semi-Senior" OR SSR) AND (Remoto OR Teletrabajo OR "Trabajo Remoto" OR Híbrido OR Remote OR Hybrid)'
    family: "data_science_es_boolean"

  # === Engenharia de Dados ===
  - query: '("Data Engineer" OR "Engenheiro de Dados" OR "Engenharia de Dados") AND (Junior OR "Júnior" OR Jr OR Pleno) AND (Remoto OR "Home Office" OR Híbrido OR Remote OR Hybrid)'
    family: "data_engineering_pt_boolean"
  - query: '("Data Engineer" OR "Data Engineering") AND (Junior OR Jr OR "Mid Level" OR "Mid-Level" OR Intermediate) AND (Remote OR Hybrid OR "Work From Home")'
    family: "data_engineering_en_boolean"
  - query: '("Data Engineer" OR "Ingeniero de Datos" OR "Ingeniería de Datos") AND (Junior OR "Júnior" OR Jr OR Pleno OR "Semi Senior" OR "Semi-Senior" OR SSR) AND (Remoto OR Teletrabajo OR "Trabajo Remoto" OR Híbrido OR Remote OR Hybrid)'
    family: "data_engineering_es_boolean"

  # === Engenharia de Software ===
  - query: '("Software Engineer" OR "Engenheiro de Software" OR "Desenvolvedor de Software" OR "Backend Engineer" OR "Desenvolvedor Backend") AND (Junior OR "Júnior" OR Jr OR Pleno) AND (Remoto OR "Home Office" OR Híbrido OR Remote OR Hybrid)'
    family: "software_engineering_pt_boolean"
  - query: '("Software Engineer" OR "Software Developer" OR "Backend Engineer" OR "Backend Developer") AND (Junior OR Jr OR "Mid Level" OR "Mid-Level" OR Intermediate) AND (Remote OR Hybrid OR "Work From Home")'
    family: "software_engineering_en_boolean"
  - query: '("Software Engineer" OR "Ingeniero de Software" OR "Desarrollador de Software" OR "Backend Engineer" OR "Desarrollador Backend") AND (Junior OR "Júnior" OR Jr OR Pleno OR "Semi Senior" OR "Semi-Senior" OR SSR) AND (Remoto OR Teletrabajo OR "Trabajo Remoto" OR Híbrido OR Remote OR Hybrid)'
    family: "software_engineering_es_boolean"

  # === Machine Learning / IA ===
  - query: '("Machine Learning Engineer" OR "ML Engineer" OR "Engenheiro de Machine Learning" OR "Engenheiro de Aprendizado de Máquina" OR "AI Engineer") AND (Junior OR "Júnior" OR Jr OR Pleno) AND (Remoto OR "Home Office" OR Híbrido OR Remote OR Hybrid)'
    family: "ml_engineering_pt_boolean"
  - query: '("Machine Learning Engineer" OR "ML Engineer" OR "AI Engineer" OR "Machine Learning Developer") AND (Junior OR Jr OR "Mid Level" OR "Mid-Level" OR Intermediate) AND (Remote OR Hybrid OR "Work From Home")'
    family: "ml_engineering_en_boolean"
  - query: '("Machine Learning Engineer" OR "ML Engineer" OR "AI Engineer" OR "Ingeniero de Machine Learning" OR "Ingeniero de Aprendizaje Automático") AND (Junior OR "Júnior" OR Jr OR Pleno OR "Semi Senior" OR "Semi-Senior" OR SSR) AND (Remoto OR Teletrabajo OR "Trabajo Remoto" OR Híbrido OR Remote OR Hybrid)'
    family: "ml_engineering_es_boolean"

  # === MLOps ===
  - query: '(MLOps OR "ML Ops" OR "Machine Learning Operations" OR "ML Platform Engineer" OR "Machine Learning Platform Engineer") AND (Junior OR "Júnior" OR Jr OR Pleno) AND (Remoto OR "Home Office" OR Híbrido OR Remote OR Hybrid)'
    family: "mlops_pt_boolean"
  - query: '(MLOps OR "ML Ops" OR "Machine Learning Operations" OR "ML Platform Engineer" OR "Machine Learning Platform Engineer") AND (Junior OR Jr OR "Mid Level" OR "Mid-Level" OR Intermediate) AND (Remote OR Hybrid OR "Work From Home")'
    family: "mlops_en_boolean"
  - query: '(MLOps OR "ML Ops" OR "Machine Learning Operations" OR "ML Platform Engineer" OR "Machine Learning Platform Engineer") AND (Junior OR "Júnior" OR Jr OR Pleno OR "Semi Senior" OR "Semi-Senior" OR SSR) AND (Remoto OR Teletrabajo OR "Trabajo Remoto" OR Híbrido OR Remote OR Hybrid)'
    family: "mlops_es_boolean"

  # === Golang ===
  - query: '(Golang OR "Go Developer" OR "Desenvolvedor Golang" OR "Desenvolvedor Go" OR "Engenheiro Golang") AND (Junior OR "Júnior" OR Jr OR Pleno) AND (Remoto OR "Home Office" OR Híbrido OR Remote OR Hybrid)'
    family: "golang_pt_boolean"
  - query: '(Golang OR "Go Developer" OR "Go Engineer" OR "Backend Golang" OR "Backend Go") AND (Junior OR Jr OR "Mid Level" OR "Mid-Level" OR Intermediate) AND (Remote OR Hybrid OR "Work From Home")'
    family: "golang_en_boolean"
  - query: '(Golang OR "Desarrollador Golang" OR "Desarrollador Go" OR "Ingeniero Golang" OR "Backend Golang") AND (Junior OR "Júnior" OR Jr OR Pleno OR "Semi Senior" OR "Semi-Senior" OR SSR) AND (Remoto OR Teletrabajo OR "Trabajo Remoto" OR Híbrido OR Remote OR Hybrid)'
    family: "golang_es_boolean"

# Estrutura canônica do perfil de busca.
search_profiles:
  careers:
    - data_science
    - data_engineering
    - software_engineering
    - machine_learning_engineering
    - mlops
    - golang
  seniority:
    junior:
      pt: ["Junior", "Júnior", "Jr"]
      en: ["Junior", "Jr"]
      es: ["Junior", "Júnior", "Jr"]
    pleno:
      pt: ["Pleno"]
      en: ["Mid Level", "Mid-Level", "Intermediate"]
      es: ["Pleno", "Semi Senior", "Semi-Senior", "SSR"]
  languages: ["pt", "en", "es"]
  modalities: ["remote", "hybrid"]
  locations:
    chile:
      remote: true
      hybrid: true
      onsite: false
    argentina:
      remote: true
      hybrid: true
      onsite: false
    spain:
      remote: true
      hybrid: true
      onsite: false
    portugal:
      remote: true
      hybrid: true
      onsite: false
    poland:
      remote: true
      hybrid: true
      onsite: false
    united_states:
      remote: true
      hybrid: true
      onsite: false
    canada:
      remote: true
      hybrid: true
      onsite: false
  technologies_ranking:
    - Python
    - Go
    - Golang
    - SQL
    - Docker
    - Kubernetes
    - FastAPI
    - Git
    - Linux
    - AWS
    - GCP
    - Azure
    - Apache Airflow
    - Apache Spark
    - PySpark
    - Databricks
    - MLflow
    - CI/CD
    - Terraform
    - PostgreSQL
    - Redis
    - Kafka
    - Machine Learning
    - NLP
    - LLM
    - Generative AI
    - MLOps
    - Data Engineering
    - Cloud

# display - formato brasileiro (editável sem mudar código)
# Usado por app/notifications/formatting.py para "Data encontrada"
display:
  timezone: "America/Sao_Paulo"
  date_format: "%d/%m/%Y às %H:%M"
  locale: "pt_BR"

# throttling - controle de rate limit (editável sem mudar código, sem precisar .env)
# Os tempos estão em segundos
throttling:
  llm_throttle_seconds: 20
  telegram_throttle_seconds: 10

# scheduler - intervalo de coleta (sem ser sensível, fica no yaml)
scheduler:
  enabled: true
  interval_minutes: 60
  collect_on_start: false
  digest_enabled: true
  digest_time: "08:00"

# thresholds
settings:
  min_score_threshold: 40
  immediate_threshold: 70

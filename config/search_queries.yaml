  - query: '("Software Engineer" OR "Software Developer" OR "Backend Engineer" OR "Backend Developer") AND (Junior OR "Entry Level" OR "Early Career" OR Intern OR Internship OR Co-op OR Coop) AND (Remote OR "Fully Remote" OR "100% Remote" OR "Work From Home") NOT (Senior OR "Senior-Level" OR Lead OR Principal OR Staff OR Manager OR Director)'
    family: "software_engineering_ca_boolean"
  - query: '("Machine Learning Engineer" OR "ML Engineer" OR "AI Engineer" OR "Machine Learning Developer") AND (Junior OR "Entry Level" OR "Early Career" OR Intern OR Internship OR Co-op OR Coop) AND (Remote OR "Fully Remote" OR "100% Remote" OR "Work From Home") NOT (Senior OR "Senior-Level" OR Lead OR Principal OR Staff OR Manager OR Director)'
    family: "ml_engineering_ca_boolean"
  - query: '(MLOps OR "ML Ops" OR "Machine Learning Operations" OR "ML Platform Engineer" OR "Machine Learning Platform Engineer") AND (Junior OR "Entry Level" OR "Early Career" OR Intern OR Internship OR Co-op OR Coop) AND (Remote OR "Fully Remote" OR "100% Remote" OR "Work From Home") NOT (Senior OR "Senior-Level" OR Lead OR Principal OR Staff OR Manager OR Director)'
    family: "mlops_ca_boolean"

# === markdown/buscas_booleanas_vagas.md §7-11 - Search Profiles canônicos ===
search_profiles:
  careers:
    - data_science
    - data_engineering
    - software_engineering
    - machine_learning_engineering
    - mlops
  seniority:
    internship:
      br: ["Estágio", "Estagiário", "Estagiária", "Intern", "Internship"]
      us_ca: ["Intern", "Internship", "Internships", "Co-op", "Coop"]
      eu: ["Intern", "Internship", "Estágio", "Estagiário", "Becario", "Becaria", "Prácticas"]
    junior:
      - Junior
      - "Júnior"
      - Jr
      - "Entry Level"
      - "Early Career"
  locations:
    brazil:
      remote: true
      onsite: ["Rio de Janeiro"]
      filters: 'Remote OR Remoto OR "Fully Remote" OR "100% Remote" OR "Work From Home" OR "Home Office"'
    united_states:
      remote: true
      onsite: false
    canada:
      remote: true
      onsite: false
    portugal:
      remote: true
      onsite: false
    spain:
      remote: true
      onsite: false
    europe:
      remote: true
      onsite: false
  technologies_ranking:
    - Python
    - Go
    - Golang
    - SQL
    - Docker
    - Kubernetes
    - FastAPI
    - Git
    - Linux
    - AWS
    - GCP
    - Azure
    - Apache Airflow
    - Apache Spark
    - PySpark
    - Databricks
    - MLflow
    - CI/CD
    - Terraform
    - PostgreSQL
    - Redis
    - Kafka
    - Machine Learning
    - NLP
    - LLM
    - Generative AI
    - MLOps
    - Data Engineering
    - Cloud

# thresholds
settings:
  min_score_threshold: 60
  immediate_threshold: 90

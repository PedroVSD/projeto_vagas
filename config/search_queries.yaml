  - query: '("Data Engineer" OR "Data Engineering") AND (Junior OR "Entry Level" OR "Early Career" OR Intern OR Internship OR Co-op OR Coop) AND (Remote OR "Fully Remote" OR "100% Remote" OR "Work From Home") NOT (Senior OR "Senior-Level" OR Lead OR Principal OR Staff OR Manager OR Director)'

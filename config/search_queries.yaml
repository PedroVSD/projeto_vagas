  - query: '("Machine Learning Engineer" OR "ML Engineer" OR "AI Engineer" OR "Machine Learning Developer" OR "Engenheiro de Machine Learning" OR "Engenheiro de Aprendizado de Máquina") AND (Intern OR Internship OR Internships OR Estágio OR Estagiário OR Estagiária OR Co-op OR Coop OR Prácticas) AND (Remote OR Remoto OR "Fully Remote" OR "100% Remote" OR "Work From Home" OR "Home Office") NOT (Senior OR "Sênior" OR Lead OR Principal OR Staff OR Manager OR Director)'
    family: "ml_engineering_br_boolean_intern"
  - query: '("Machine Learning Engineer" OR "ML Engineer" OR "AI Engineer" OR "Machine Learning Developer" OR "Engenheiro de Machine Learning" OR "Engenheiro de Aprendizado de Máquina") AND (Junior OR "Júnior" OR Jr OR "Entry Level" OR "Early Career") AND (Remote OR Remoto OR "Fully Remote" OR "100% Remote" OR "Work From Home" OR "Home Office") NOT (Senior OR "Sênior" OR Lead OR Principal OR Staff OR Manager OR Director)'
    family: "ml_engineering_br_boolean_junior"

  # 5. MLOps
  - query: '(MLOps OR "ML Ops" OR "Machine Learning Operations" OR "ML Platform Engineer" OR "Machine Learning Platform Engineer" OR "Machine Learning Platform") AND (Junior OR "Júnior" OR Jr OR Intern OR Internship OR Estágio OR Estagiário OR Trainee) AND (Remote OR Remoto OR "Fully Remote" OR "100% Remote" OR "Work From Home" OR "Home Office") NOT (Senior OR "Sênior" OR Lead OR Principal OR Staff OR Manager OR Director)'
    family: "mlops_br_boolean_base"
  - query: '(MLOps OR "ML Ops" OR "Machine Learning Operations" OR "ML Platform Engineer" OR "Machine Learning Platform Engineer" OR "Machine Learning Platform") AND (Intern OR Internship OR Internships OR Estágio OR Estagiário OR Estagiária OR Co-op OR Coop) AND (Remote OR Remoto OR "Fully Remote" OR "100% Remote" OR "Work From Home" OR "Home Office") NOT (Senior OR "Sênior" OR Lead OR Principal OR Staff OR Manager OR Director)'
    family: "mlops_br_boolean_intern"
  - query: '(MLOps OR "ML Ops" OR "Machine Learning Operations" OR "ML Platform Engineer" OR "Machine Learning Platform Engineer" OR "Machine Learning Platform") AND (Junior OR "Júnior" OR Jr OR "Entry Level" OR "Early Career") AND (Remote OR Remoto OR "Fully Remote" OR "100% Remote" OR "Work From Home" OR "Home Office") NOT (Senior OR "Sênior" OR Lead OR Principal OR Staff OR Manager OR Director)'

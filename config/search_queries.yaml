  - query: '("Software Engineer" OR "Software Developer" OR "Backend Engineer" OR "Backend Developer" OR "Engenheiro de Software" OR "Desenvolvedor de Software" OR "Engenheiro Backend" OR "Desenvolvedor Backend") AND (Intern OR Internship OR Internships OR Estágio OR Estagiário OR Estagiária OR Co-op OR Coop) AND (Remote OR Remoto OR "Fully Remote" OR "100% Remote" OR "Work From Home" OR "Home Office") NOT (Senior OR "Sênior" OR Lead OR Principal OR Staff OR Manager OR Director)'
    family: "software_engineering_br_boolean_intern"
  - query: '("Software Engineer" OR "Software Developer" OR "Backend Engineer" OR "Backend Developer" OR "Engenheiro de Software" OR "Desenvolvedor de Software" OR "Engenheiro Backend" OR "Desenvolvedor Backend") AND (Junior OR "Júnior" OR Jr OR "Entry Level" OR "Early Career") AND (Remote OR Remoto OR "Fully Remote" OR "100% Remote" OR "Work From Home" OR "Home Office") NOT (Senior OR "Sênior" OR Lead OR Principal OR Staff OR Manager OR Director)'
    family: "software_engineering_br_boolean_junior"

  # 4. Machine Learning Engineer
  - query: '("Machine Learning Engineer" OR "ML Engineer" OR "Machine Learning" OR "AI Engineer" OR "Machine Learning Developer" OR "Engenheiro de Machine Learning" OR "Engenheiro de Aprendizado de Máquina") AND (Junior OR "Júnior" OR Jr OR Intern OR Internship OR Estágio OR Estagiário OR Trainee) AND (Remote OR Remoto OR "Fully Remote" OR "100% Remote" OR "Work From Home" OR "Home Office") NOT (Senior OR "Sênior" OR Lead OR Principal OR Staff OR Manager OR Director)'

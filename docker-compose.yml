services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_finder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/job_finder
      APP_ENV: development
      LOG_LEVEL: INFO
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    command: >
      bash -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Fase 5 - Worker/Scheduler APScheduler (monólito modular)
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/job_finder
      SCHEDULER_ENABLED: "true"
      SCHEDULER_INTERVAL_MINUTES: "60"
      DIGEST_ENABLED: "true"
      DIGEST_TIME: "08:00"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    command: >
      bash -c "uv run alembic upgrade head && uv run python -m app.workers.scheduler"
    profiles: ["worker"]

  # Alias scheduler (mesma imagem, mesmo comando) - permite docker compose --profile scheduler up
  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/job_finder
      SCHEDULER_ENABLED: "true"
      SCHEDULER_INTERVAL_MINUTES: "60"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    command: >
      bash -c "uv run alembic upgrade head && uv run python -m app.workers.scheduler"
    profiles: ["scheduler"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    profiles: ["worker", "celery"]

  # LLM local - Ollama (opcional, Fase 6)
  # Uso: docker compose --profile ollama up -d
  # Baixar modelo: docker exec projeto_vagas-ollama-1 ollama pull llama3.1:8b
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    profiles: ["ollama"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  ollama_data:
